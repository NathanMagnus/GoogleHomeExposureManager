name: Auto Tag Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/google_home_exposure_manager/manifest.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to manifest version)"
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          MANIFEST_VERSION=$(jq -r '.version' custom_components/google_home_exposure_manager/manifest.json)
          INPUT_VERSION="${{ inputs.version }}"
          VERSION="${INPUT_VERSION:-$MANIFEST_VERSION}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_exists
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.tag_exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ inputs.prerelease }}"
          RELEASE_ARGS=()
          NOTES="Release ${{ steps.version.outputs.tag }}"

          if [[ "$PRERELEASE" == "true" || ( "$PRERELEASE" != "false" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            RELEASE_ARGS+=(--prerelease)
            NOTES="Prerelease ${{ steps.version.outputs.tag }}"
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "$NOTES" \
            "${RELEASE_ARGS[@]}"
