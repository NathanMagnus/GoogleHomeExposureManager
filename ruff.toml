# Ruff configuration for Google Home Exposure Manager

# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "RUF",  # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (black handles this)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "RET504",  # unnecessary variable assignment before return
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
]

# Same as Home Assistant
line-length = 88
target-version = "py312"

[per-file-ignores]
# Allow print statements in tests
"tests/*" = ["T20"]

[isort]
# Use Home Assistant's isort configuration
force-sort-within-sections = true
known-first-party = ["custom_components.google_home_exposure_manager"]
combine-as-imports = true
split-on-trailing-comma = false

[mccabe]
max-complexity = 15
